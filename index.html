<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Quiz Dinâmico</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .question { margin-bottom: 20px; border-bottom: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <h1>Carregando Quiz...</h1>
</div>
<button onclick="verificar()">Verificar Respostas</button>

<script>
    // Carrega o arquivo JSON dinamicamente
    fetch('quiz.json')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('quiz-container');
            container.innerHTML = "<h1>Quiz de Imunologia</h1>";
            
            data.questions.forEach((item, index) => {
                let options = item.options.map((opt, i) => 
                    `<li><input type="radio" name="q${index}" value="${i}"> ${opt}</li>`
                ).join('');
                container.innerHTML += `<div class="question"><p>${item.id}. ${item.question}</p><ul>${options}</ul></div>`;
            });
            window.quizData = data; // Salva dados para usar na verificação
        });

    function verificar() {
        let score = 0;
        window.quizData.questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === item.correct) score++;
        });
        alert(`Você acertou ${score} de ${window.quizData.questions.length}!`);
    }
</script>
</body>
</html>
